<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">Clean Reading</div>
        </div>

        <div class="content">
            <!-- Ad Blocking Toggle -->
            <div class="toggle-section">
                <div class="toggle-content">
                    <span class="toggle-label">Ad Blocking</span>
                    <label class="switch">
                        <input type="checkbox" id="globalToggle">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-description">Remove common advertisement elements</div>
                <!-- Add Stats Section -->
                <div class="stats-section">
                    <div class="stats-item">
                        <span class="stats-label">Ads Blocked:</span>
                        <span class="stats-value" id="adsBlockedCount">0</span>
                    </div>
                    <div class="stats-item">
                        <span class="stats-label">Elements Hidden:</span>
                        <span class="stats-value" id="elementsHiddenCount">0</span>
                    </div>
                    <div class="stats-actions">
                        <button id="resetStats" class="reset-button">Reset Stats</button>
                    </div>
                </div>
            </div>

            <!-- Reader Mode Toggle -->
            <div class="toggle-section">
                <div class="toggle-content">
                    <span class="toggle-label">Reader Mode</span>
                    <label class="switch">
                        <input type="checkbox" id="readerModeToggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <!-- Reader Mode Controls -->
            <div class="reader-mode-controls" id="readerModeControls">
                <button id="hideElementBtn" class="button primary-button">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 4C8.55228 4 9 4.44772 9 5V7H11C11.5523 7 12 7.44772 12 8C12 8.55228 11.5523 9 11 9H9V11C9 11.5523 8.55228 12 8 12C7.44772 12 7 11.5523 7 11V9H5C4.44772 9 4 8.55228 4 8C4 7.44772 4.44772 7 5 7H7V5C7 4.44772 7.44772 4 8 4Z" fill="currentColor"/>
                    </svg>
                    Select Elements to Hide
                </button>
                <button id="restoreElementsBtn" class="button secondary-button">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3.5 7.5C3.5 5.01472 5.51472 3 8 3C9.84075 3 11.4397 4.10005 12.1803 5.69875M12.5 8.5C12.5 10.9853 10.4853 13 8 13C6.15925 13 4.56028 11.8999 3.81971 10.3012" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M14 6L12 8L10 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 10L4 8L6 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Restore Hidden Elements
                </button>
            </div>

            <!-- Whitelist Toggle -->
            <div class="toggle-section">
                <div class="toggle-content">
                    <span class="toggle-label">Whitelist This Site</span>
                    <label class="switch">
                        <input type="checkbox" id="whitelistToggle">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-description">Disable Clean Reading for this website</div>
            </div>

            <div class="status" id="status"></div>
        </div>

        <div class="footer">
            <button id="optionsBtn" class="button secondary-button">Options</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
